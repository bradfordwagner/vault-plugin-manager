name: docker-tags
on:
  push:
    tags:
      - '*'
env:
  image: ghcr.io/bradfordwagner/vault-plugin-manager
  # The owned Go builder used for the build stage. Pin to a real tag.
  builder_image: ghcr.io/bradfordwagner/go-builder:1.26-ubuntu_noble
jobs:
  # Build each architecture on its own native runner (no QEMU) and push the
  # per-arch image by digest. The manifest list is stitched together in `merge`.
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        base:
          - { suffix: scratch, image: scratch }
          - { suffix: alpine-3.22, image: "alpine:3.22" }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: "build ${{ matrix.base.suffix }} ${{ matrix.platform.arch }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            BUILDER_IMAGE=${{ env.builder_image }}
            BASE_IMAGE=${{ matrix.base.image }}
          outputs: type=image,name=${{ env.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.base.suffix }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest list per base
  # variant and push it under the release tag.
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        base:
          - { suffix: scratch }
          - { suffix: alpine-3.22 }
    name: "merge ${{ matrix.base.suffix }}"
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.base.suffix }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.image }}:${{ github.ref_name }}-${{ matrix.base.suffix }} \
            $(printf '${{ env.image }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.image }}:${{ github.ref_name }}-${{ matrix.base.suffix }}
