name: docker-branches
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch: {}
env:
  image: ghcr.io/bradfordwagner/vault-plugin-manager
  # The owned Go builder used for the build stage. Pin to a real tag.
  builder_image: ghcr.io/bradfordwagner/go-builder:1.26-ubuntu_noble
jobs:
  # Validate every base variant on both architectures in parallel (native
  # runners, no QEMU). Branch builds don't push, so there's no manifest to
  # stitch — the tag workflow does that.
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        base:
          - { suffix: scratch, image: scratch }
          - { suffix: alpine-3.22, image: "alpine:3.22" }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: "build ${{ matrix.base.suffix }} ${{ matrix.platform.arch }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          push: false
          build-args: |
            BUILDER_IMAGE=${{ env.builder_image }}
            BASE_IMAGE=${{ matrix.base.image }}
          tags: ${{ env.image }}:ci-${{ matrix.base.suffix }}-${{ matrix.platform.arch }}
