name: docker-branches
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch: {}
env:
  image: ghcr.io/bradfordwagner/vault-plugin-manager
  # The owned Go builder used for the build stage. Pin to a real tag.
  builder_image: ghcr.io/bradfordwagner/go-builder:latest
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suffix: scratch, base: scratch }
          - { suffix: alpine-3.22, base: "alpine:3.22" }
    name: "build ${{ matrix.suffix }}"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            BUILDER_IMAGE=${{ env.builder_image }}
            BASE_IMAGE=${{ matrix.base }}
          tags: ${{ env.image }}:ci-${{ matrix.suffix }}
