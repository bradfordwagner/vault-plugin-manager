name: helm-tags
on:
  push:
    tags:
      - '*'
permissions:
  contents: read
  packages: write
jobs:
  publish-chart:
    name: publish helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # Chart version must be SemVer2, so strip a leading "v" from the tag.
      - name: version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: helm registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: package
        run: |
          helm package ./chart \
            --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}"

      # Pushes to ghcr.io/bradfordwagner/charts/vault-plugin-manager:<version>.
      # The /charts path keeps it distinct from the image repo of the same name.
      - name: push
        run: helm push "vault-plugin-manager-${{ steps.v.outputs.version }}.tgz" oci://ghcr.io/bradfordwagner/charts
