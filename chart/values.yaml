image:
  repository: ghcr.io/bradfordwagner/vault-plugin-manager
  tag: ""            # defaults to <appVersion>-scratch (see image variants: -scratch, -alpine-3.xx)
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Manager settings. These map 1:1 to the server's env vars / flags.
vault:
  addr: "https://vault.vault.svc:8200"
  authMount: kubernetes
  authRole: vault-plugin-manager
  caCert: ""          # path to a mounted CA cert (optional)
  skipVerify: false
  # Vault pod discovery for exec-copy. Empty namespace = release namespace.
  podSelector: "app.kubernetes.io/name=vault"
  namespace: ""
  container: vault
  pluginDir: /vault/plugins

# Liveness / readiness probes. The manager serves no traffic, so these endpoints
# exist purely so Kubernetes can tell a working manager from a wedged one:
#   /healthz (liveness)  - fails when the reconcile loop misses its deadline
#                          (resyncInterval + settings.stallTimeout), when the
#                          Vault token has been invalid for
#                          settings.tokenFailTimeout, or when the ConfigMap
#                          watcher has stopped outright.
#   /readyz  (readiness) - flips true on the first clean reconcile pass, so
#                          `helm --wait` / `rollout status` gates on the manager
#                          actually reconciling. It drops while the Vault token
#                          has been invalid for settings.tokenGracePeriod, or the
#                          ConfigMap watch has been failing for
#                          settings.watchGracePeriod. Reconcile errors are
#                          reported in the response body but do not unready the
#                          pod.
# Both probes are rendered verbatim, so any field a Kubernetes probe accepts can
# be set here; `port: health` refers to the named container port below.
health:
  enabled: true
  port: 8080
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Prometheus metrics. The manager serves /metrics on the SAME port as the health
# probes, so there is no separate address or container port -- and metrics
# require health.enabled. The endpoint is always served when that server runs;
# the flags below only control whether anything can reach and scrape it.
metrics:
  # Renders a ClusterIP Service exposing the /metrics endpoint. Scraping by
  # annotation-based Prometheus discovery needs only this.
  enabled: true
  service:
    annotations: {}
  service_monitor:
    # Renders a monitoring.coreos.com/v1 ServiceMonitor. This requires the
    # Prometheus Operator CRDs to be installed; the chart does NOT check for
    # them, so the install fails loudly if they are absent. That is deliberate:
    # a silently-missing ServiceMonitor means you asked for monitoring and got
    # none, with no error to tell you.
    enabled: false
    interval: 30s
    scrape_timeout: 10s
    # Extra labels on the ServiceMonitor -- typically the label your Prometheus
    # instance selects on (e.g. release: kube-prometheus-stack).
    labels: {}
    # Rendered verbatim into the scrape endpoint.
    relabelings: []
    metric_relabelings: []

# OCI pulls: allow plain-HTTP / untrusted-TLS registries (e.g. an in-cluster
# registry used for testing). Leave false in production.
ociInsecure: false

configMap:
  # Name of the ConfigMap the manager watches. Empty namespace = release namespace.
  name: vault-plugins
  namespace: ""
  key: plugins.yaml
  # When true, the chart renders the ConfigMap below from `spec`. When false,
  # the ConfigMap is expected to exist already (managed out-of-band).
  create: true
  # This is the document the manager watches. Edit it (or `kubectl edit` the live
  # ConfigMap) to change behavior at runtime — no redeploy needed.
  spec:
    # Runtime tunables, re-read on every reconcile.
    settings:
      # pruneMode: what to do when an owned mount/version leaves this ConfigMap.
      #   full        - fully authoritative: disable the mount, deregister the
      #                 version from the catalog, AND delete the binary from every
      #                 Vault pod. Use when this ConfigMap is the source of truth.
      #   deregister  - disable the mount + deregister the version, but LEAVE the
      #                 binary on disk (faster rollback; re-adding skips re-copy).
      #   never       - add/update only; removals are ignored, cleanup is manual.
      pruneMode: full
      # resyncInterval: how often to run a full drift reconcile (Go duration).
      resyncInterval: 5m
      # logLevel: debug | info | warn | error
      logLevel: info
      # stallTimeout: how long one reconcile pass may run before the liveness
      # probe calls the loop wedged and Kubernetes restarts the pod. Raise it if
      # a legitimate pass (large plugin, many Vault pods) can take longer.
      stallTimeout: 10m
      # tokenGracePeriod: how long the Vault token may stay invalid (login or
      # renewal failing) before the pod reports NOT ready.
      tokenGracePeriod: 2m
      # tokenFailTimeout: how long the Vault token may stay invalid before the
      # pod reports NOT live and Kubernetes restarts it. Must be >=
      # tokenGracePeriod; keep it long, because a restart does not fix a Vault
      # that is down.
      tokenFailTimeout: 15m
      # watchGracePeriod: how long the ConfigMap watch may keep failing (erroring
      # but still relisting) before the pod reports NOT ready. A watcher that has
      # stopped outright fails liveness immediately, with no grace.
      watchGracePeriod: 2m
    catalog: []
    mounts: []
    # roles: secret-engine role bodies to UPSERT at <mount>/<rolesPath>/<name>.
    # `data` is written verbatim to the plugin (vpm is schema-agnostic). Under
    # pruneMode `full`, roles under a declared rolesPath on a managed mount that
    # are not listed here are deleted.
    #
    # rolesPath (optional, default `roles`) is the path segment(s) BETWEEN the
    # mount and the role name. The default reproduces the classic
    # <mount>/roles/<name> layout; an override like `realm/<realm>/roles` places
    # the role at <mount>/realm/<realm>/roles/<name> for plugins that use a
    # deeper, plugin-owned role hierarchy.
    #
    #   roles:
    #     - mount: example              # references a mounts[].path
    #       name: reader                # role name (last path segment)
    #       data:                       # written verbatim; the plugin owns the schema
    #         ttl: "1h"
    #     - mount: example
    #       name: reader
    #       rolesPath: realm/example/roles
    #       data:
    #         ttl: "1h"
    roles: []

# The manager needs get/list on pods and create on pods/exec, plus watch on the
# ConfigMap. Set to false to supply your own RBAC.
rbac:
  create: true

serviceAccount:
  create: true
  name: ""            # defaults to the fullname
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
