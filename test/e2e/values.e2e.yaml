# Helm values for the e2e run. The plugins ConfigMap is created out-of-band by
# run.sh (it needs the computed sha256), so configMap.create is false here.
image:
  repository: vault-plugin-manager
  tag: e2e
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: vault-plugin-manager

vault:
  addr: http://vault:8200
  authMount: kubernetes
  authRole: vault-plugin-manager
  podSelector: app=vault
  container: vault
  pluginDir: /vault/plugins

# The fetchers hold the whole plugin binary in memory (download buffer plus the
# extracted binary, plus a buffered OCI layer), so the chart's 128Mi default is
# marginal even for the small test plugin — it OOMKilled mid-fetch on 2 of 3
# matrix legs. Give the e2e headroom so a restart cannot mask a real failure.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pull the test plugin image from the in-cluster registry over plain HTTP.
ociInsecure: true

# The metrics Service is exercised by the run; the ServiceMonitor is not, since
# the kind cluster has no Prometheus Operator CRDs to accept the CR.
metrics:
  enabled: true
  service_monitor:
    enabled: false

configMap:
  create: false
  name: vault-plugins
  key: plugins.yaml
