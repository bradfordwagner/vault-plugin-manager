# In-cluster OCI registry. The manager pulls the test plugin image from here over
# plain HTTP (source.image=registry:5000/...), which is why the chart sets
# ociInsecure=true for e2e. run.sh pushes the image in via port-forward.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: e2e
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: e2e
spec:
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
